    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
    - https://raw.githubusercontent.com/halfsend-12/test-repo-01-base-harness-host/
mint_url: https://bt-b7cae178-bt-mint.fullsend-ai.workers.dev
inference:
    project: it-gcp-konflux-e2e-fullsend
    wif_provider: projects/208332380190/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-halfsend-12-test-repo-01
