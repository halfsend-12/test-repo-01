      source: harness/local-base.yaml
    - name: local-child
      source: harness/local-child.yaml
    - name: remote-base-child
      source: harness/remote-base-child.yaml
    - name: remote-child
      source: https://raw.githubusercontent.com/halfsend-12/test-repo-01-base-harness-host/main/harness/remote-child.yaml#sha256=c6e93145324c31e3dc9d02f4ea0588167c7fc797cd114770e0d88dc5eced1da5
